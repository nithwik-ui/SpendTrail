<script>
        // Simple script to demonstrate swipe-to-delete interaction hint
        function simulateSwipe(element) {
            element.classList.add('swipe-hint-active');
            setTimeout(() => {
                element.classList.remove('swipe-hint-active');
            }, 800);
        }

        // Auto trigger hint on load for demonstration
        window.addEventListener('load', () => {
            setTimeout(() => {
                const item = document.getElementById('swipe-demo-item');
                if(item) {
                    item.classList.add('swipe-hint-active');
                    setTimeout(() => {
                        item.classList.remove('swipe-hint-active');
                    }, 1000);
                }
            }, 1000);
        });
    </script>
