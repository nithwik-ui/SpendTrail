<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SpendTrail - Home Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Montserrat:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#e4e2e1",
                        "on-secondary-fixed": "#00201e",
                        "on-error-container": "#93000a",
                        "surface-container": "#f0eded",
                        "background": "#fcf9f8",
                        "tertiary-container": "#915239",
                        "on-tertiary-fixed": "#380d00",
                        "primary": "#00535b",
                        "surface-bright": "#fcf9f8",
                        "surface-dim": "#dcd9d9",
                        "on-tertiary-fixed-variant": "#6f3720",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#001f23",
                        "on-secondary-container": "#286d67",
                        "inverse-surface": "#303030",
                        "surface-tint": "#006972",
                        "on-tertiary-container": "#ffd7c9",
                        "surface-container-high": "#eae7e7",
                        "outline": "#6f797a",
                        "on-background": "#1b1c1c",
                        "primary-fixed-dim": "#82d3de",
                        "secondary-fixed": "#acefe7",
                        "secondary-container": "#a9ece5",
                        "tertiary-fixed": "#ffdbce",
                        "on-secondary-fixed-variant": "#00504b",
                        "on-primary-fixed-variant": "#004f56",
                        "inverse-primary": "#82d3de",
                        "inverse-on-surface": "#f3f0f0",
                        "tertiary": "#743b24",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#90d3cb",
                        "outline-variant": "#bec8ca",
                        "on-primary": "#ffffff",
                        "on-surface": "#1b1c1c",
                        "on-primary-container": "#9becf7",
                        "primary-fixed": "#9ff0fb",
                        "surface": "#fcf9f8",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e4e2e1",
                        "surface-container-low": "#f6f3f2",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#3e494a",
                        "tertiary-fixed-dim": "#ffb59a",
                        "secondary": "#236863",
                        "primary-container": "#006d77"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "sm": "8px",
                        "gutter-mobile": "12px",
                        "lg": "24px",
                        "xs": "4px",
                        "xl": "32px",
                        "unit": "4px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-sm": ["Montserrat"],
                        "label-md": ["Inter"],
                        "headline-md": ["Montserrat"],
                        "headline-lg-mobile": ["Montserrat"],
                        "body-lg": ["Inter"],
                        "display-currency": ["Montserrat"],
                        "headline-lg": ["Montserrat"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-currency": ["40px", { "lineHeight": "48px", "letterSpacing": "-1px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md overflow-x-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background dark:bg-background flex items-center justify-between px-margin-mobile py-sm z-40">
<div class="w-10 h-10 rounded-full overflow-hidden shrink-0 active:scale-95 transition-transform hover:opacity-80 border border-outline-variant/20">
<img class="w-full h-full object-cover" data-alt="A softly lit, natural portrait of a young Indian male college student smiling warmly. He is wearing a casual, solid color t-shirt. The background is a gently blurred college campus environment during daytime. Warm, inviting lighting emphasizing a friendly and approachable mood." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBV9SiIbAVhoEIpUpSv3tnECcSDAtOQslvJFM7ssbVkdNNxvZpfa_ZPocuSoZAZsm0cE7vf8392Zgm-UU2kbibo0vP9ZNlthKH_gwM21duCPOTz_zI0HsdYK7z1l7d2BPXnl52QDIJUkXwbiqaE1nshoOrqv7ZIxMRO9QbqqVFCAQFiCrNbRYrQ4RyhEL3VBKmG654zfWSyWA85Q3nyTEIZXWGZcdYrlVEfWbtHilrBs997KjDtSp-mVQ"/>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim tracking-tight">SpendTrail</h1>
<button class="text-primary dark:text-primary-fixed-dim hover:opacity-80 active:scale-95 transition-transform flex items-center justify-center p-2 rounded-full">
<span class="material-symbols-outlined">account_balance_wallet</span>
</button>
</header>
<!-- Main Canvas -->
<main class="px-margin-mobile pb-32">
<!-- Greeting -->
<section class="mt-md animate-[fadeIn_0.5s_ease-out]">
<p class="font-body-lg text-body-lg text-on-surface-variant">Hello,</p>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Rahul 👋</h2>
</section>
<!-- Budget Card (Bento Style) -->
<section class="mt-lg">
<div class="bg-surface-container rounded-xl p-lg relative overflow-hidden flex flex-col md:flex-row items-center gap-lg">
<!-- Soft background accent pattern -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#00535b 1px, transparent 1px); background-size: 16px 16px;"></div>
<div class="relative w-32 h-32 shrink-0 flex-none">
<svg class="w-full h-full -rotate-90 transform" viewbox="0 0 36 36">
<path class="text-primary/10" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-dasharray="100, 100" stroke-width="4"></path>
<path class="text-primary transition-all duration-1000 ease-out" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-dasharray="70.4, 100" stroke-linecap="round" stroke-width="4"></path>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="material-symbols-outlined text-primary mb-xs" style="font-size: 20px;">pie_chart</span>
<span class="font-label-md text-label-md text-on-background font-bold">70%</span>
</div>
</div>
<div class="flex-1 text-center md:text-left z-10">
<h3 class="font-headline-sm text-headline-sm text-on-background mb-sm">Monthly Budget</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-xs">Spent</p>
<p class="font-display-currency text-display-currency text-on-background leading-none">₹8,450</p>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">of <span class="font-medium">₹12,000</span> limit</p>
</div>
</div>
</section>
<!-- Quick Actions Grid (Glassmorphism-lite) -->
<section class="mt-md grid grid-cols-2 gap-gutter-mobile">
<button class="bg-secondary-container/30 border border-secondary-container/50 rounded-xl p-md flex items-center gap-sm active:scale-95 transition-transform hover:bg-secondary-container/50">
<div class="w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined" style="font-size: 18px;">qr_code_scanner</span>
</div>
<span class="font-label-md text-label-md text-on-background">Scan &amp; Pay</span>
</button>
<button class="bg-tertiary-container/10 border border-tertiary-container/20 rounded-xl p-md flex items-center gap-sm active:scale-95 transition-transform hover:bg-tertiary-container/20">
<div class="w-8 h-8 rounded-full bg-tertiary-container/20 text-tertiary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined" style="font-size: 18px;">csv</span>
</div>
<span class="font-label-md text-label-md text-on-background">Split Bill</span>
</button>
</section>
<!-- Recent Transactions -->
<section class="mt-xl">
<div class="flex justify-between items-center mb-md">
<h3 class="font-headline-sm text-headline-sm text-on-background">Recent Transactions</h3>
<button class="font-label-md text-label-md text-primary hover:opacity-80 active:scale-95 transition-transform">See all</button>
</div>
<div class="flex flex-col gap-lg">
<!-- Group: Today -->
<div>
<h4 class="font-label-sm text-label-sm text-outline mb-sm uppercase tracking-wider pl-xs">Today</h4>
<div class="flex flex-col">
<!-- Item 1 -->
<div class="flex items-center gap-md py-sm active:bg-surface-container-low transition-colors rounded-lg -mx-sm px-sm cursor-pointer">
<div class="w-12 h-12 rounded-xl bg-tertiary-container/10 flex items-center justify-center shrink-0 text-tertiary">
<span class="material-symbols-outlined">restaurant</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-body-md text-body-md text-on-background truncate">Lunch at Canteen</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Food &amp; Beverage</p>
</div>
<div class="text-right shrink-0">
<p class="font-headline-sm text-headline-sm text-on-background">-₹80</p>
</div>
</div>
<div class="h-px w-full bg-outline-variant/20 my-xs ml-16"></div>
<!-- Item 2 -->
<div class="flex items-center gap-md py-sm active:bg-surface-container-low transition-colors rounded-lg -mx-sm px-sm cursor-pointer">
<div class="w-12 h-12 rounded-xl bg-secondary-container/40 flex items-center justify-center shrink-0 text-secondary">
<span class="material-symbols-outlined">local_taxi</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-body-md text-body-md text-on-background truncate">Auto Rickshaw</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Transport</p>
</div>
<div class="text-right shrink-0">
<p class="font-headline-sm text-headline-sm text-on-background">-₹45</p>
</div>
</div>
</div>
</div>
<!-- Group: Yesterday -->
<div>
<h4 class="font-label-sm text-label-sm text-outline mb-sm uppercase tracking-wider pl-xs">Yesterday</h4>
<div class="flex flex-col">
<!-- Item 3 -->
<div class="flex items-center gap-md py-sm active:bg-surface-container-low transition-colors rounded-lg -mx-sm px-sm cursor-pointer">
<div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center shrink-0 text-primary">
<span class="material-symbols-outlined">menu_book</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-body-md text-body-md text-on-background truncate">Stationery Shop</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Academics</p>
</div>
<div class="text-right shrink-0">
<p class="font-headline-sm text-headline-sm text-on-background">-₹120</p>
</div>
</div>
</div>
</div>
</div>
</section>
</main>
<!-- Floating Action Button -->
<button class="fixed bottom-[88px] right-margin-mobile w-14 h-14 bg-primary text-on-primary rounded-xl flex items-center justify-center shadow-[0_4px_20px_rgba(0,83,91,0.25)] active:scale-95 transition-transform z-40 md:hidden">
<span class="material-symbols-outlined" style="font-size: 28px;">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-2 pb-safe bg-surface-container-lowest dark:bg-surface-container-lowest shadow-[0_-4px_20px_rgba(0,109,119,0.08)] z-50 rounded-t-xl md:hidden">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-primary-container text-on-secondary-container dark:text-on-primary-container rounded-xl px-4 py-1 active:scale-98 transition-all duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</button>
<!-- Analytics -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-variant/50 active:scale-98 transition-all duration-200 rounded-xl">
<span class="material-symbols-outlined">insights</span>
<span class="font-label-sm text-label-sm mt-1">Analytics</span>
</button>
<!-- History -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-variant/50 active:scale-98 transition-all duration-200 rounded-xl">
<span class="material-symbols-outlined">receipt_long</span>
<span class="font-label-sm text-label-sm mt-1">History</span>
</button>
<!-- Settings -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-variant/50 active:scale-98 transition-all duration-200 rounded-xl">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-sm text-label-sm mt-1">Settings</span>
</button>
</nav>
</body></html>
