    <script class="">
        const inputField = document.getElementById('amount-input');
        let currentAmount = "";

        function appendNum(num) {
            if (num === '.' && currentAmount.includes('.')) return;
            if (currentAmount.length >= 8) return; // Limit input
            currentAmount += num;
            updateInput();
        }

        function backspace() {
            currentAmount = currentAmount.slice(0, -1);
            updateInput();
        }

        function updateInput() {
            inputField.value = currentAmount || "";
            // Adjust input width based on length
            if (currentAmount.length > 5) {
                inputField.classList.remove('w-48');
                inputField.classList.add('w-auto');
            } else {
                inputField.classList.add('w-48');
            }
        }

        // Simple interaction for category selection
        document.querySelectorAll('.hide-scrollbar button').forEach(btn => {
            btn.</script></body></html>
